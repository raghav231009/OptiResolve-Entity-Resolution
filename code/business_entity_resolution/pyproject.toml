[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optiresolve-er"
version = "0.1.0"
description = "High-Efficiency Entity Resolution Pipeline for Amazon ML Challenge"
authors = [{name = "OptiResolve Team"}]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "rapidfuzz>=3.8.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0"
]

[tool.setuptools.packages.find]
where = ["src"]
